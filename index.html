<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"> <!-- FontAwesome CDN -->
    <title>Green University</title>
    <style>
        a {
            color: #000;
            text-decoration: none;
        }
        a:hover {
            color: #000;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Main Container -->
    <div class="container mx-auto text-center m-4">

        <!-- Logo and Welcome Message -->
        <div class="mb-6">
            <a href="index.html">
                <img src="img/greenlogo.png" alt="Green University Logo" class="mx-auto w-32">
                <p class="mt-2">Welcome To Green University</p>
            </a>
        </div>

        <!-- Links Row 1 -->
        <div class="flex justify-center gap-6 mb-6 mx-4">
            <!-- Portal Card -->
            <a href="https://studentportal.green.edu.bd/" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-user-circle fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Portal</h6>
                </div>
            </a>
            <!-- Library Card -->
            <a href="https://library.green.edu.bd/" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-book fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Library</h6>
                </div>
            </a>
        </div>

        <!-- Links Row 2 -->
        <div class="flex justify-center gap-6 mb-6 mx-4">
            <!-- Notice Card -->
            <a href="https://green.edu.bd/exam-seat-plans" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-list fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Seat Plans</h6>
                </div>
            </a>
            <!-- Payment Card -->
            <a href="contact.html" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-phone fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Contact</h6>
                </div>
            </a>
        </div>

        <!-- Links Row 3 -->
        <div class="flex justify-center gap-6 mb-6 mx-4">
            <!-- Clubs -->
            <a href="gubclub.html" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-users fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Clubs</h6>
                </div>
            </a>
            <!-- Departments -->
            <a href="gubdept.html" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-building fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Departments</h6>
                </div>
            </a>
        </div>

        <!-- Links Row 4 -->
        <div class="flex justify-center gap-6 mb-6 mx-4">
            <!-- Notice -->
            <a href="https://green.edu.bd/notice" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-bell fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Notice</h6>
                </div>
            </a>
            <!-- Faculty -->
            <a href="https://green.edu.bd/faculty-member/dept-of-cse" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-chalkboard-teacher fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Faculty</h6>
                </div>
            </a>
        </div>

        <!-- Links Row 5 -->
        <div class="flex justify-center gap-6 mb-6 mx-4">
            <!-- Campus Map -->
            <a href="https://green.edu.bd/campus-map" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-map-marked-alt fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Campus Map</h6>
                </div>
            </a>
            <!-- Floor Plan -->
            <a href="https://green.edu.bd/floor-plan" class="w-48">
                <div class="bg-white p-6 rounded-lg shadow-lg hover:bg-gray-200 transition">
                    <i class="fas fa-th-large fa-2x mb-4"></i> <!-- FontAwesome Icon -->
                    <h6 class="text-gray-800 font-semibold">Floor Plan</h6>
                </div>
            </a>
        </div>

        <!-- Additional Links -->
        <div class="flex flex-col items-center gap-4 mx-4">
            <!-- Pay using Rocket/Bkash -->
            <a href="help-payment.html" class="w-full md:w-1/2">
                <div class="bg-white p-4 rounded-lg shadow-lg hover:bg-gray-200 transition flex items-center justify-center space-x-3">
                    <i class="fas fa-money-bill-wave text-gray-800 text-xl"></i>
                    <h6 class="text-gray-800 font-semibold text-center">Pay using Rocket/Bkash?</h6>
                </div>
            </a>
            <!-- How to pre-registration -->
            <a href="pre-registration.html" class="w-full md:w-1/2">
                <div class="bg-white p-4 rounded-lg shadow-lg hover:bg-gray-200 transition flex items-center justify-center space-x-3">
                    <i class="fas fa-book text-gray-800 text-xl"></i>
                    <h6 class="text-gray-800 font-semibold text-center">How to pre-registration?</h6>
                </div>
            </a>
            <!-- Privacy and Policy -->
            <a href="privecy.html" class="w-full md:w-1/2">
                <div class="bg-white p-4 rounded-lg shadow-lg hover:bg-gray-200 transition flex items-center justify-center space-x-3">
                    <i class="fas fa-shield-alt text-gray-800 text-xl"></i>
                    <h6 class="text-gray-800 font-semibold text-center">Privacy</h6>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
